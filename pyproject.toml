[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "idat-sync"
version = "0.0.1"
authors = [{ name = "Tony Acuña Flores", email = "toanacfl@gmail.com" }]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/tony-97/idat-sync/idat-sync"
Issues = "https://github.com/tony-97/idat-sync/idat-sync"

[project.gui-scripts]
idat_sync = "idat_sync.main:main"
