[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "idat-sync"
version = "0.0.2"
dependencies = [
    "async-tkinter-loop >= 0.10.2",
    "office365-rest-python-client @ git+https://github.com/vgrem/office365-rest-python-client.git@8268769c2575549a6e8af87c5ba4518f3a714cf3",
    "playwright >= 1.55.0",
    "yt-dlp[default]",
    "requests >= 2.32.5",
]
authors = [{ name = "Tony Acuña Flores", email = "toanacfl@gmail.com" }]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/tony-97/idat-sync/idat-sync"
Issues = "https://github.com/tony-97/idat-sync/idat-sync"

[project.gui-scripts]
idat_sync = "idat_sync.main:main"
