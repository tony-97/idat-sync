name: Build and Release Package and Executable

on:
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Enable Git long paths
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the package and its dependencies from pyproject.toml
          pip install .
          # Install PyInstaller
          pip install pyinstaller

      - name: Build Python Package (sdist and wheel)
        # We only need to build the Python package once, so we tie it to the Linux runner
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install build
          python -m build

      - name: Install chromium on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          playwright install --no-shell chromium

      - name: Install webkit on MacOS
        if: matrix.os == 'macos-latest'
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          playwright install webkit

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            SEP=";"
            FFMPEG_PATH=$(cygpath -w "$(which ffmpeg)")
            FFPROBE_PATH=$(cygpath -w "$(which ffprobe)")

            # Ensure Windows binaries have the .exe extension
            [[ "$FFMPEG_PATH" != *".exe" ]] && FFMPEG_PATH="${FFMPEG_PATH}.exe"
            [[ "$FFPROBE_PATH" != *".exe" ]] && FFPROBE_PATH="${FFPROBE_PATH}.exe"
          else
            SEP=":"
            FFMPEG_PATH=$(which ffmpeg)
            FFPROBE_PATH=$(which ffprobe)
          fi

          if [ "$RUNNER_OS" == "macOS" ]; then
            ONEFILE_FLAG=""
          else
            ONEFILE_FLAG="--onefile"
          fi

          pyinstaller \
          --windowed \
          $ONEFILE_FLAG \
          --collect-all yt_dlp \
          --copy-metadata yt-dlp \
          --hidden-import yt_dlp.extractor \
          --hidden-import yt_dlp.postprocessor \
          --add-binary "$FFMPEG_PATH${SEP}." \
          --add-binary "$FFPROBE_PATH${SEP}." \
          --name idat_sync \
          --paths=src/idat_sync \
          ./src/idat_sync/main.py

      - name: Fix MacOS app bundle
        if: matrix.os == 'macos-latest'
        run: |
          # 1. Clean garbage files and linker stubs that break macOS codesign
          find dist/idat_sync.app -name ".DS_Store" -delete
          find dist/idat_sync.app -name "._*" -delete
          find dist/idat_sync.app -name "*.tbd" -delete

          # 2. Delete broken PyInstaller signatures
          find dist/idat_sync.app -type d -name "_CodeSignature" -exec rm -rf {} +

          # 3. THE FIX: Dynamically rebuild Apple's exact framework symlink structure
          echo "=== Fixing PyInstaller Framework structures ==="
          find dist/idat_sync.app/Contents/Frameworks/playwright -type d -name "*.framework" | while read -r fw; do
              if [ -d "$fw/Versions/A" ]; then
                  echo "Repairing structure of: $(basename "$fw")"
                  
                  # A. Delete everything in the root EXCEPT the 'Versions' directory
                  find "$fw" -mindepth 1 -maxdepth 1 ! -name "Versions" -exec rm -rf {} +
                  
                  # B. Re-link Current -> A
                  rm -rf "$fw/Versions/Current"
                  ln -s "A" "$fw/Versions/Current"
                  
                  # C. Dynamically create correct symlinks in the root pointing to Versions/Current/
                  for item in "$fw/Versions/A"/*; do
                      item_name=$(basename "$item")
                      ln -s "Versions/Current/$item_name" "$fw/$item_name"
                  done
              else
                  echo "Warning: No Versions/A found in $(basename "$fw")"
              fi
          done

          # 4. Sign inner Playwright libraries and binaries (.dylib and .so)
          find dist/idat_sync.app/Contents/Frameworks/playwright -name "*.dylib" -o -name "*.so" | \
            xargs -I{} codesign -s - --force {}

          # 5. Sign the newly repaired Playwright frameworks
          find dist/idat_sync.app/Contents/Frameworks/playwright -name "*.framework" | \
            xargs -I{} codesign -s - --force --options runtime {}

          # 6. Finally, sign the outer application wrapper
          codesign -s - --force --options runtime dist/idat_sync.app

      - name: Create DMG
        if: matrix.os == 'macos-latest'
        id: create-dmg
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: "idat_sync"
          src_dir: "dist/idat_sync.app"

      - name: Rename Output Files
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/idat_sync.exe dist/idat_sync-${{ runner.os }}.exe
          elif [ "$RUNNER_OS" == "Linux" ]; then
            mv dist/idat_sync dist/idat_sync-${{ runner.os }}
          else
            mv idat_sync.dmg dist/idat_sync-${{ runner.os }}.dmg
          fi

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: build-artifacts-${{ matrix.os }}-${{ strategy.job-index }} # Ensure unique names
          path: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: dist # Downloads everything into the 'dist' folder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
