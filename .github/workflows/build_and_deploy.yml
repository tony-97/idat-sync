name: Build and Release Package and Executable

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev .

      - name: Run Tests
        run: python -m unittest

      - name: Run Ruff
        run: ruff check .

      - name: Run Pylint
        run: pylint src tests

  build:
    name: Build on ${{ matrix.os }}
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build Frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Install WebKitGTK on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the package and its dependencies from pyproject.toml
          if [ "$RUNNER_OS" == "Linux" ]; then
            pip install ".[linux]"
          else
            pip install .
          fi
          # Install PyInstaller
          pip install pyinstaller
        shell: bash

      - name: Build Python Package (sdist and wheel)
        # We only need to build the Python package once, so we tie it to the Linux runner
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install build
          python -m build

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            SEP=";"
            FFMPEG_PATH=$(cygpath -w "$(which ffmpeg)")
            FFPROBE_PATH=$(cygpath -w "$(which ffprobe)")

            # Ensure Windows binaries have the .exe extension
            [[ "$FFMPEG_PATH" != *".exe" ]] && FFMPEG_PATH="${FFMPEG_PATH}.exe"
            [[ "$FFPROBE_PATH" != *".exe" ]] && FFPROBE_PATH="${FFPROBE_PATH}.exe"
          else
            SEP=":"
            FFMPEG_PATH=$(which ffmpeg)
            FFPROBE_PATH=$(which ffprobe)
          fi

          if [ "$RUNNER_OS" == "macOS" ]; then
            ONEFILE_FLAG=""
          else
            ONEFILE_FLAG="--onefile"
          fi

          pyinstaller \
          --windowed \
          $ONEFILE_FLAG \
          --collect-all yt_dlp \
          --copy-metadata yt-dlp \
          --hidden-import yt_dlp.extractor \
          --hidden-import yt_dlp.postprocessor \
          --add-data "src/idat_sync/ui/index.html${SEP}idat_sync/ui" \
          --add-binary "$FFMPEG_PATH${SEP}." \
          --add-binary "$FFPROBE_PATH${SEP}." \
          --name idat_sync \
          --paths=src/idat_sync \
          ./src/idat_sync/main.py

      - name: Fix MacOS app bundle
        if: matrix.os == 'macos-latest'
        run: |
          # Clean garbage files, extended attributes, and linker stubs that break macOS codesign
          find dist/idat_sync.app -name ".DS_Store" -delete
          find dist/idat_sync.app -name "._*" -delete
          find dist/idat_sync.app -name "*.tbd" -delete
          xattr -cr dist/idat_sync.app

          # Delete broken PyInstaller signatures and ad-hoc sign the app bundle
          find dist/idat_sync.app -type d -name "_CodeSignature" -exec rm -rf {} +
          codesign --force --deep -s - dist/idat_sync.app

      - name: Create DMG
        if: matrix.os == 'macos-latest'
        id: create-dmg
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: "idat_sync"
          src_dir: "dist/idat_sync.app"

      - name: Rename Output Files
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/idat_sync.exe dist/idat_sync-${{ runner.os }}.exe
          elif [ "$RUNNER_OS" == "Linux" ]; then
            mv dist/idat_sync dist/idat_sync-${{ runner.os }}
          else
            mv idat_sync.dmg dist/idat_sync-${{ runner.os }}.dmg
          fi

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ matrix.os }}-${{ strategy.job-index }} # Ensure unique names
          path: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz

  build-android:
    name: Build Android APK
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract pywebview-android.jar
        run: |
          pip install pywebview
          python -c "import pathlib, shutil, webview; shutil.copy(pathlib.Path(webview.__file__).parent / 'lib/pywebview-android.jar', 'pywebview-android.jar')"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ${{ runner.temp }}/buildozer-cache
          key: buildozer-docker-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-docker-v2-

      - name: Build APK with Buildozer (Docker)
        run: |
          mkdir -p "${{ runner.temp }}/buildozer-cache"
          rm -rf .buildozer/android/platform/build-*/build/venv
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -v "${{ runner.temp }}/buildozer-cache:/home/user/.buildozer" \
            kivy/buildozer android debug
          status=$?
          sudo chown -R "$(id -u):$(id -g)" .buildozer bin "${{ runner.temp }}/buildozer-cache" 2>/dev/null || true
          exit $status

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-android
          path: bin/*.apk

  release:
    name: Create GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: dist # Downloads everything into the 'dist' folder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          files: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz
            dist/*.apk
          generate_release_notes: true
