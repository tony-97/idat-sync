name: Build and Release Package and Executable

on:
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # Update this to your target Python version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the package and its dependencies from pyproject.toml
          pip install .
          # Install PyInstaller
          pip install pyinstaller

      - name: Build Python Package (sdist and wheel)
        # We only need to build the Python package once, so we tie it to the Linux runner
        # if: matrix.os == 'ubuntu-latest'
        run: |
          pip install build
          python -m build

      - name: Install chromium for non windows OS
        # if: matrix.os != 'windows-latest'
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          playwright install webkit

      # --onefile \
      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          FFPROBE_PATH=$(which ffprobe)
          if [ "$RUNNER_OS" == "Windows" ]; then
            SEP=";"
          else
            SEP=":"
          fi
          pyinstaller \
          --windowed \
          --collect-all yt_dlp \
          --copy-metadata yt-dlp \
          --hidden-import yt_dlp.extractor \
          --hidden-import yt_dlp.postprocessor \
          --add-binary "$FFMPEG_PATH${SEP}." \
          --add-binary "$FFPROBE_PATH${SEP}." \
          --name idat_sync \
          --paths=src/idat_sync \
          ./src/idat_sync/main.py

      - name: Create DMG
        if: matrix.os == 'macos-latest'
        id: create-dmg
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: "idat_sync"
          src_dir: "dist/idat_sync.app"

      - name: Rename Output Files
        shell: bash
        run: |
          echo "==================================s"
          ls ${{ steps.create-dmg.outputs.dmg_path }}
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/idat_sync.exe dist/idat_sync-${{ runner.os }}.exe
          elif [ "$RUNNER_OS" == "Linux" ]; then
            mv dist/idat_sync dist/idat_sync-${{ runner.os }}
          else
            mv dist/idat_sync.dmg dist/idat_sync-${{ runner.os }}.dmg
          fi

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          # Automatically attaches the built files to the GitHub Release
          files: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
