name: Build and Release Package and Executable

on:
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Install WebKitGTK on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev

      - name: Enable Git long paths
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the package and its dependencies from pyproject.toml
          if [ "$RUNNER_OS" == "Linux" ]; then
            pip install ".[linux]"
          else
            pip install .
          fi
          # Install PyInstaller
          pip install pyinstaller
        shell: bash

      - name: Build Python Package (sdist and wheel)
        # We only need to build the Python package once, so we tie it to the Linux runner
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install build
          python -m build

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            SEP=";"
            FFMPEG_PATH=$(cygpath -w "$(which ffmpeg)")
            FFPROBE_PATH=$(cygpath -w "$(which ffprobe)")

            # Ensure Windows binaries have the .exe extension
            [[ "$FFMPEG_PATH" != *".exe" ]] && FFMPEG_PATH="${FFMPEG_PATH}.exe"
            [[ "$FFPROBE_PATH" != *".exe" ]] && FFPROBE_PATH="${FFPROBE_PATH}.exe"
          else
            SEP=":"
            FFMPEG_PATH=$(which ffmpeg)
            FFPROBE_PATH=$(which ffprobe)
          fi

          if [ "$RUNNER_OS" == "macOS" ]; then
            ONEFILE_FLAG=""
          else
            ONEFILE_FLAG="--onefile"
          fi

          pyinstaller \
          --windowed \
          $ONEFILE_FLAG \
          --collect-all yt_dlp \
          --copy-metadata yt-dlp \
          --hidden-import yt_dlp.extractor \
          --hidden-import yt_dlp.postprocessor \
          --add-data "src/idat_sync/ui/index.html${SEP}idat_sync/ui" \
          --add-binary "$FFMPEG_PATH${SEP}." \
          --add-binary "$FFPROBE_PATH${SEP}." \
          --name idat_sync \
          --paths=src/idat_sync \
          ./src/idat_sync/main.py

      - name: Fix MacOS app bundle
        if: matrix.os == 'macos-latest'
        run: |
          # Clean garbage files and linker stubs that break macOS codesign
          find dist/idat_sync.app -name ".DS_Store" -delete
          find dist/idat_sync.app -name "._*" -delete
          find dist/idat_sync.app -name "*.tbd" -delete

          # Delete broken PyInstaller signatures and ad-hoc sign the app bundle
          find dist/idat_sync.app -type d -name "_CodeSignature" -exec rm -rf {} +
          codesign -s - --force --options runtime dist/idat_sync.app

      - name: Create DMG
        if: matrix.os == 'macos-latest'
        id: create-dmg
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: "idat_sync"
          src_dir: "dist/idat_sync.app"

      - name: Rename Output Files
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/idat_sync.exe dist/idat_sync-${{ runner.os }}.exe
          elif [ "$RUNNER_OS" == "Linux" ]; then
            mv dist/idat_sync dist/idat_sync-${{ runner.os }}
          else
            mv idat_sync.dmg dist/idat_sync-${{ runner.os }}.dmg
          fi

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: build-artifacts-${{ matrix.os }}-${{ strategy.job-index }} # Ensure unique names
          path: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: dist # Downloads everything into the 'dist' folder

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/idat_sync-*
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
